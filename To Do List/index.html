<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Time-Based ToDo List</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="todoTitle.png" type="image/x-icon">
</head>
<body>
  <div class="container">
    <h1>⏰ Smart ToDo Scheduler</h1>

    <div class="input-area">
      <input type="text" id="taskName" placeholder="Enter task..." />
      <input type="time" id="startTime" />
      <input type="time" id="endTime" />
      <input type="text" id="category" placeholder="Enter category (e.g. Study)" />

      <button id="addBtn">Add Task</button>
    </div>

    <div class="now-task-section">
      <h2>📌 Current Task</h2>
      <ul id="nowTask"></ul>
    </div>

    <div class="all-task-section">
      <h2>📋 All Tasks</h2>
      <ul id="todoList"></ul>
    </div>

    <footer>
      <p>Made by Preksha 💖</p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
